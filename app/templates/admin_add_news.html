<!DOCTYPE html>
<html class="transition duration-300 ease-in-out" lang="{{ current_lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{{ t.add_news }} | SPK Pramuka</title>

    <!-- Tailwind CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/output.css') }}"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    />

    <!-- CKEditor 5 -->
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>

    <!-- Alpine.js -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <!-- Script Sidebar -->
    {% include "script_sidebar.html" %}

    <!-- Script Theme -->
    {% include 'script_theme.html' %}

    <style>
      .ck-editor__editable {
        min-height: 400px;
      }
      .dark .ck-toolbar {
        background-color: #1f2937 !important;
        border-color: #374151 !important;
      }
      .dark .ck-content {
        background-color: #111827 !important;
        color: #d1d5db !important;
        border-color: #374151 !important;
      }
      .dark .ck.ck-editor__main > .ck-editor__editable:not(.ck-focused) {
        border-color: #374151 !important;
      }
      .dark .ck.ck-toolbar .ck.ck-toolbar__separator {
        background: #374151 !important;
      }
      .dark .ck.ck-button,
      .dark .ck.ck-dropdown__button {
        color: #d1d5db !important;
      }
      .dark .ck.ck-button:hover,
      .dark .ck.ck-button.ck-on {
        background: #374151 !important;
      }
    </style>
  </head>
  <body
    x-data="{
      ready: false,
      thumbnailPreview: null
    }"
    x-init="ready = true"
    :class="{ 'dark': $store.theme?.isDark }"
    x-bind:class="{
        'bg-background-dark text-white': $store.theme?.isDark,
        'bg-gray-100 text-black': !$store.theme?.isDark
      }"
    class="transition duration-300 ease-in-out font-sans scroll-smooth {{ 'bg-background-dark text-white' if current_theme == 'dark' else 'bg-gray-100 text-black' }}"
  >
    <div
      class="flex h-screen {{ 'bg-gray-800' if current_theme == 'dark' else 'bg-gray-300' }}"
    >
      <!-- Sidebar -->
      {% include 'sidebar.html' %}

      <!-- Main content -->
      <div class="flex flex-col flex-1 overflow-hidden h-full">
        <!-- Top Navbar -->
        {% set is_public_page = false %} {% include 'header.html' %}

        <!-- Page Content -->
        <main
          class="flex-1 overflow-y-auto pt-28 h-full transition-all duration-300"
          :class="Alpine.store('sidebar').open ? 'ml-[15%]' : 'ml-[5%]'"
        >
          <section
            class="flex flex-col wow animate__animated animate__fadeInUp animate__delay-0.5s {{ 'bg-gray-800' if current_theme == 'dark' else 'bg-gray-300' }}"
          >
            <div class="px-6 py-6">
              <!-- Data Peserta Card -->
              <div
                class="rounded-2xl shadow-xl w-full mx-auto {{ 'bg-white dark:bg-gray-900 text-white' if current_theme == 'dark' else 'bg-white text-gray-800' }}"
              >
                <div
                  class="p-6 border-b {{ 'border-gray-700' if current_theme == 'dark' else 'border-gray-200' }} flex justify-between items-center"
                >
                  <h2 class="text-xl font-bold">
                    <i class="fa-solid fa-plus-circle mr-2 text-blue-500"></i>
                    {{ t.add_news }}
                  </h2>
                  <a
                    href="{{ url_for('admin_manajemen_berita') }}"
                    class="px-4 py-2 rounded-lg bg-gray-500 hover:bg-gray-600 text-white text-sm transition"
                  >
                    <i class="fa-solid fa-arrow-left mr-2"></i> {{ 'Kembali' if
                    current_lang == 'id' else 'Back' }}
                  </a>
                </div>

                <div class="p-8">
                  <form
                    method="POST"
                    action="{{ url_for('admin_create_news') }}"
                    enctype="multipart/form-data"
                  >
                    <input
                      type="hidden"
                      name="csrf_token"
                      value="{{ csrf_token() }}"
                    />

                    <!-- Layout Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                      <!-- Left Column: Form Inputs -->
                      <div class="md:col-span-2 space-y-6">
                        <!-- Judul -->
                        <div>
                          <label class="block mb-2 font-semibold">
                            {{ 'Judul Berita' if current_lang == 'id' else
                            'Title' }} <span class="text-red-500">*</span>
                          </label>
                          <input
                            type="text"
                            name="title"
                            class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500 focus:outline-none transition {{ 'dark:bg-gray-800 dark:border-gray-700' if current_theme == 'dark' else 'bg-gray-50 border-gray-300' }}"
                            placeholder="{{ 'Masukkan judul berita yang menarik...' if current_lang == 'id' else 'Enter an engaging news title...' }}"
                            required
                          />
                        </div>

                        <!-- Konten (CKEditor) -->
                        <div>
                          <label class="block mb-2 font-semibold">
                            {{ 'Konten' if current_lang == 'id' else 'Content'
                            }} <span class="text-red-500">*</span>
                          </label>
                          <textarea id="editor" name="content"></textarea>
                        </div>
                      </div>

                      <!-- Right Column: Sidebar Options -->
                      <div class="space-y-6">
                        <!-- Status -->
                        <div
                          class="p-5 rounded-xl border {{ 'dark:bg-gray-800 dark:border-gray-700' if current_theme == 'dark' else 'bg-gray-50 border-gray-200' }}"
                        >
                          <h3
                            class="font-semibold mb-4 border-b pb-2 {{ 'border-gray-600' if current_theme == 'dark' else 'border-gray-300' }}"
                          >
                            Publikasi
                          </h3>

                          <div class="mb-4">
                            <label class="block mb-2 text-sm font-medium"
                              >Status</label
                            >
                            <select
                              name="status"
                              class="w-full px-3 py-2 rounded border {{ 'dark:bg-gray-900 dark:border-gray-600' if current_theme == 'dark' else 'bg-white border-gray-300' }}"
                            >
                              <option value="draft">Draft</option>
                              <option value="published">Published</option>
                            </select>
                          </div>

                          <button
                            type="submit"
                            class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition shadow-lg shadow-blue-500/30"
                          >
                            <i class="fa-solid fa-save mr-2"></i> {{ t.save }}
                          </button>
                        </div>

                        <!-- Thumbnail -->
                        <div
                          class="p-5 rounded-xl border {{ 'dark:bg-gray-800 dark:border-gray-700' if current_theme == 'dark' else 'bg-gray-50 border-gray-200' }}"
                        >
                          <h3
                            class="font-semibold mb-4 border-b pb-2 {{ 'border-gray-600' if current_theme == 'dark' else 'border-gray-300' }}"
                          >
                            Thumbnail
                          </h3>

                          <div class="mb-3">
                            <div
                              class="w-full h-48 rounded-lg border-2 border-dashed flex flex-col items-center justify-center cursor-pointer overflow-hidden relative {{ 'border-gray-600 hover:border-blue-500 bg-gray-900' if current_theme == 'dark' else 'border-gray-300 hover:border-blue-500 bg-white' }}"
                              @click="$refs.fileInput.click()"
                            >
                              <template x-if="!thumbnailPreview">
                                <div class="text-center p-4">
                                  <i
                                    class="fa-regular fa-image text-3xl mb-2 text-gray-400"
                                  ></i>
                                  <p class="text-sm text-gray-500">
                                    {{ 'Klik untuk upload' if current_lang ==
                                    'id' else 'Click to upload' }}
                                  </p>
                                </div>
                              </template>
                              <img
                                x-show="thumbnailPreview"
                                :src="thumbnailPreview"
                                class="w-full h-full object-cover"
                              />
                            </div>
                            <input
                              x-ref="fileInput"
                              type="file"
                              name="thumbnail"
                              accept="image/*"
                              class="hidden"
                              @change="
                                                    const file = $event.target.files[0]; 
                                                    if(file && file.type.startsWith('image/')) {
                                                        const reader = new FileReader();
                                                        reader.onload = e => thumbnailPreview = e.target.result;
                                                        reader.readAsDataURL(file);
                                                    } else { 
                                                        alert('File harus berupa gambar!'); 
                                                        $event.target.value = '';
                                                    }"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Init CKEditor -->
    <script>
      ClassicEditor.create(document.querySelector("#editor")).catch((error) => {
        console.error(error);
      });
    </script>
  </body>
</html>
