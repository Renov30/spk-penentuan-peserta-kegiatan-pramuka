<script>
  window.isFirstTimeLogin = {{ 'true' if first_time_login else 'false' }};
  const toggleButton = document.getElementById("notification-toggle");
  const notifBox = document.getElementById("notification-box");
  let currentTab = 'system';
  let notifications = [];
  let unreadCount = 0;

  // Get CSRF token
  const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';

  // Theme and language config
  const isDarkMode = document.documentElement.classList.contains('dark') ||
                    document.body.classList.contains('bg-background-dark');
  const currentLang = '{{ current_lang }}' || 'id';

  // Text strings
  const texts = {
    id: {
      loading: 'Memuat notifikasi...',
      failed: 'Gagal memuat notifikasi',
      empty: 'Tidak ada notifikasi',
      new: 'Baru',
      markRead: 'Tandai Dibaca',
      delete: 'Hapus',
      confirmDelete: 'Apakah Anda yakin ingin menghapus notifikasi ini?',
      confirmClearAll: 'Apakah Anda yakin ingin menandai semua notifikasi sebagai dibaca?'
    },
    en: {
      loading: 'Loading notifications...',
      failed: 'Failed to load notifications',
      empty: 'No notifications',
      new: 'New',
      markRead: 'Mark Read',
      delete: 'Delete',
      confirmDelete: 'Are you sure you want to delete this notification?',
      confirmClearAll: 'Are you sure you want to mark all notifications as read?'
    }
  };
  const t = texts[currentLang] || texts.id;

  // Load notifications from API
  async function loadNotifications() {
    const loadingEl = document.getElementById("notification-loading");
    const systemTab = document.getElementById("system-tab");
    const emptyEl = document.getElementById("notification-empty");

    try {
      loadingEl.classList.remove("hidden");
      systemTab.classList.add("hidden");
      emptyEl.classList.add("hidden");

      const response = await fetch("/api/notifikasi", {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
        },
        credentials: "same-origin",
      });

      if (!response.ok) {
        throw new Error("Failed to load notifications");
      }

      const data = await response.json();

      if (data.success) {
        notifications = data.notifications || [];
        unreadCount = data.unread_count || 0;

        loadingEl.classList.add("hidden");
        renderNotifications();
        updateNotificationCount();
      } else {
        throw new Error(data.message || "Failed to load notifications");
      }
    } catch (error) {
      console.error("Error loading notifications:", error);
      loadingEl.classList.add("hidden");
      systemTab.innerHTML = `
        <div class="text-center py-4">
          <p class="text-sm ${isDarkMode ? 'text-red-400' : 'text-red-600'}">
            ${t.failed}
          </p>
        </div>
      `;
      systemTab.classList.remove("hidden");
    }
  }

  // Render notifications
  function renderNotifications() {
    const systemTab = document.getElementById("system-tab");
    const emptyEl = document.getElementById("notification-empty");

    if (notifications.length === 0) {
      systemTab.classList.add("hidden");
      emptyEl.classList.remove("hidden");
      return;
    }

    emptyEl.classList.add("hidden");
    systemTab.innerHTML = notifications.map(notif => {
      const isRead = notif.is_read;
      const borderClass = isRead
        ? "border-gray-300"
        : "border-blue-500";
      const iconClass = isRead
        ? "text-gray-400"
        : "text-blue-500";
      const bgClass = isDarkMode ? "hover:bg-gray-800" : "hover:bg-gray-50";
      const textClass = isDarkMode ? "text-white" : "text-gray-900";
      const borderColor = isDarkMode ? "border-gray-200" : "border-gray-200";

      return `
        <div
          id="notification-item-${notif.id}"
          class="border-l-4 ${borderClass} border ${borderColor} rounded-lg p-3 shadow-sm hover:shadow-md transition ${bgClass}"
        >
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-start gap-2 flex-1">
              <i class="fas fa-bell ${iconClass} text-lg mt-1"></i>
              <div class="flex-1">
                <p class="text-sm font-semibold ${textClass}">
                  ${escapeHtml(notif.message)}
                </p>
                ${!isRead ? `
                  <span class="inline-block mt-2 px-2 py-1 text-xs rounded bg-blue-500 text-white">
                    ${t.new}
                  </span>
                ` : ''}
              </div>
            </div>
            <div class="flex flex-col gap-1">
              ${!isRead ? `
                <button
                  onclick="markNotificationAsRead(${notif.id})"
                  class="px-2 py-1 text-xs bg-blue-500 text-white rounded hover:bg-blue-600 cursor-pointer transition"
                  title="${t.markRead}"
                >
                  <i class="fas fa-check"></i>
                </button>
              ` : ''}
              <button
                onclick="deleteNotificationFromBox(${notif.id})"
                class="px-2 py-1 text-xs bg-red-500 text-white rounded hover:bg-red-600 cursor-pointer transition"
                title="${t.delete}"
              >
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    systemTab.classList.remove("hidden");
  }

  // Update notification count badge
  function updateNotificationCount() {
    const badge = document.querySelector("#notification-toggle span");
    const boxCount = document.getElementById("notification-box-count");

    if (badge) {
      badge.textContent = unreadCount;
      if (unreadCount > 0) {
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    if (boxCount) {
      boxCount.textContent = unreadCount;
      if (unreadCount > 0) {
        boxCount.classList.remove("hidden");
      } else {
        boxCount.classList.add("hidden");
      }
    }
  }

  // Mark notification as read
  async function markNotificationAsRead(notificationId) {
    try {
      const response = await fetch(`/api/notifikasi/mark-read/${notificationId}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfToken,
        },
        credentials: "same-origin",
      });

      const data = await response.json();

      if (data.success) {
        // Update local state
        const notif = notifications.find(n => n.id === notificationId);
        if (notif) {
          notif.is_read = true;
          unreadCount = Math.max(0, unreadCount - 1);
        }

        // Re-render
        renderNotifications();
        updateNotificationCount();
      }
    } catch (error) {
      console.error("Error marking notification as read:", error);
    }
  }

  // Delete notification
  async function deleteNotificationFromBox(notificationId) {
    if (!confirm(t.confirmDelete)) {
      return;
    }

    try {
      const response = await fetch(`/api/notifikasi/delete/${notificationId}`, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfToken,
        },
        credentials: "same-origin",
      });

      const data = await response.json();

      if (data.success) {
        // Remove from local state
        notifications = notifications.filter(n => n.id !== notificationId);
        const notif = notifications.find(n => n.id === notificationId);
        if (notif && !notif.is_read) {
          unreadCount = Math.max(0, unreadCount - 1);
        }

        // Re-render
        renderNotifications();
        updateNotificationCount();
      }
    } catch (error) {
      console.error("Error deleting notification:", error);
    }
  }

  // Switch tab
  window.switchTab = function(tab) {
    currentTab = tab;
    const systemTab = document.getElementById("system-tab");
    const interactionTab = document.getElementById("interaction-tab");
      const tabSystemBtn = document.getElementById("tab-system");
      const tabInteractionBtn = document.getElementById("tab-interaction");
      const activeBorderClass = isDarkMode ? "border-white" : "border-black";

      if (tab === 'system') {
        systemTab.classList.remove("hidden");
        interactionTab.classList.add("hidden");
        tabSystemBtn.classList.add(activeBorderClass);
        tabSystemBtn.classList.remove("border-transparent");
        tabInteractionBtn.classList.remove(activeBorderClass);
        tabInteractionBtn.classList.add("border-transparent");
      } else {
        systemTab.classList.add("hidden");
        interactionTab.classList.remove("hidden");
        tabInteractionBtn.classList.add(activeBorderClass);
        tabInteractionBtn.classList.remove("border-transparent");
        tabSystemBtn.classList.remove(activeBorderClass);
        tabSystemBtn.classList.add("border-transparent");
      }
  };

  // Clear all notifications
  window.clearAllNotifications = async function() {
    if (!confirm(t.confirmClearAll)) {
      return;
    }

    try {
      const response = await fetch("/api/notifikasi/mark-all-read", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfToken,
        },
        credentials: "same-origin",
      });

      const data = await response.json();

      if (data.success) {
        // Update all notifications to read
        notifications.forEach(notif => {
          notif.is_read = true;
        });
        unreadCount = 0;

        // Re-render
        renderNotifications();
        updateNotificationCount();
      }
    } catch (error) {
      console.error("Error clearing notifications:", error);
    }
  };

  // Escape HTML to prevent XSS
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Toggle show/hide box
  toggleButton?.addEventListener("click", function (event) {
    event.stopPropagation();
    const isOpen = notifBox.classList.contains("opacity-100");

    if (isOpen) {
      notifBox.classList.remove("opacity-100", "pointer-events-auto", "scale-100", "translate-x-0");
      notifBox.classList.add("opacity-0", "pointer-events-none", "scale-95", "translate-x-full");
    } else {
      notifBox.classList.remove("opacity-0", "pointer-events-none", "scale-95", "translate-x-full");
      notifBox.classList.add("opacity-100", "pointer-events-auto", "scale-100", "translate-x-0");
      // Load notifications when box opens
      loadNotifications();
    }
  });

  // Klik di luar notif box → tutup
  document.addEventListener("click", function (event) {
    if (
      notifBox &&
      !notifBox.contains(event.target) &&
      !toggleButton?.contains(event.target)
    ) {
      notifBox.classList.remove(
        "opacity-100", "pointer-events-auto", "scale-100", "translate-x-0"
      );
      notifBox.classList.add(
        "opacity-0", "pointer-events-none", "scale-95", "translate-x-full"
      );
    }
  });

  // Flash → tombol "Tutup" → tampil notifBox selama 6 detik
  window.closeFlashAndShowNotifBox = function (element) {
    const flashOverlay = element.closest(".flash-wrapper");

    if (flashOverlay) flashOverlay.classList.add("hidden");

    if (window.isFirstTimeLogin && notifBox) {
      console.log("🚀 Login pertama kali, tampilkan notifBox selama 6 detik");

      notifBox.classList.remove(
        "opacity-100", "pointer-events-auto", "scale-100", "translate-x-0"
      );
      notifBox.classList.add(
        "opacity-0", "pointer-events-none", "scale-95", "translate-x-full"
      );
      notifBox.style.transform = "none";
      console.log("[DEBUG] notifBox.classList after show:", notifBox.classList);

      setTimeout(() => {
        notifBox.classList.remove(
          "opacity-0", "pointer-events-none", "scale-95", "translate-x-full"
        );
        notifBox.classList.add(
          "opacity-100", "pointer-events-auto", "scale-100", "translate-x-0"
        );
        loadNotifications();
        fetch("/clear-first-login-flag", { method: "POST" });
      }, 200);
    } else {
      console.log("ℹ️ Bukan login pertama → notifBox tidak muncul otomatis");
    }
  };

  // Load initial notification count
  document.addEventListener("DOMContentLoaded", function() {
    updateNotificationCount();
  });
</script>
