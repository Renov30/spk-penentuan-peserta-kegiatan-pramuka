<!DOCTYPE html>
<html lang="id" style="font-size: 80%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terlalu Banyak Percobaan - SPK Pramuka</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/output.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full mx-4">
      <div class="bg-white rounded-xl shadow-lg p-8 text-center">
        <div class="mb-6">
          <i class="fa-solid fa-clock text-6xl text-yellow-500"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-4">429</h1>
        <h2 class="text-xl font-semibold text-gray-700 mb-4">
          Terlalu Banyak Percobaan
        </h2>
        <p class="text-gray-600 mb-6">
          {{ message or 'Terlalu banyak percobaan login. Silakan coba lagi
          nanti.' }}
        </p>
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
          <p class="text-sm text-yellow-800">
            <i class="fa-solid fa-info-circle mr-2"></i>
            Untuk keamanan akun Anda, kami membatasi jumlah percobaan login.
            Silakan tunggu beberapa menit sebelum mencoba lagi.
          </p>
        </div>
        <a
          href="{{ url_for('login') }}"
          class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition"
        >
          <i class="fa-solid fa-arrow-left mr-2"></i>
          Kembali ke Login
        </a>
      </div>
    </div>
  </body>
</html>
